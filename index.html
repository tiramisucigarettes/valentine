<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Lavantika Mehra</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-pink: #fce4ec;
            --deep-pink: #f06292;
            --sunflower-yellow: #ffeb3b;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--soft-pink);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            /* Animated Background of Sunflowers and Lilies */
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
        }

        /* Flower Background Decor */
        .background-flowers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        .flower {
            position: absolute;
            font-size: 50px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Scrapbook Card */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 8px solid white;
            max-width: 500px;
            position: relative;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-pink);
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
        }

        #yesBtn {
            background-color: var(--deep-pink);
            color: white;
            box-shadow: 0 4px 15px rgba(240, 98, 146, 0.4);
        }

        #noBtn {
            background-color: #eee;
            color: #777;
            position: absolute;
        }

        /* Success State */
        .hidden { display: none; }
        
        #celebration img {
            width: 250px;
            border-radius: 20px;
        }

        p.success-msg {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--deep-pink);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="background-flowers">
        <span class="flower" style="top: 10%; left: 10%;">🌻</span>
        <span class="flower" style="top: 20%; right: 15%;">🌸</span>
        <span class="flower" style="bottom: 15%; left: 20%;">🌻</span>
        <span class="flower" style="bottom: 10%; right: 10%;">🌸</span>
        <span class="flower" style="top: 50%; left: 5%;">🌻</span>
    </div>

    <div class="container" id="mainCard">
        <h1>Lavantika Mehra, <br> will you be my Valentine?</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="showLove()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <div class="container hidden" id="celebration">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXp6bmNqNnV4eXp6bmNqNnV4eXp6bmNqNnV4eXp6bmNqJnB0X2luc2lkZT10cnVlJm89Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Blushing Cat">
        <p class="success-msg">Yay! I knew you'd say yes! 💖</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function showLove() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('celebration').classList.remove('hidden');
        }
    </script>
</body>
</html>
